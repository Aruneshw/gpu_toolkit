name: Build release assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build binaries and checksums
        env:
          VERSION: ${{ github.ref_name }}
        run: make dist VERSION="$VERSION"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/meshcompute-linux-amd64 dist/meshcompute-linux-arm64 dist/meshcompute-windows-amd64.exe dist/SHA256SUMS --generate-notes
