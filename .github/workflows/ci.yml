name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ["1.24.x", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: gofmt
        if: runner.os == 'Linux' && matrix.go == 'stable'
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test with race detector
        if: runner.os == 'Linux'
        run: go test -race ./... -count=1
      - name: test
        if: runner.os == 'Windows'
        run: go test ./... -count=1
      - name: build
        run: go build ./...

  offline:
    name: offline build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build without network or toolchain downloads
        env:
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: |
          go build ./...
          go test ./... -count=1

  cross:
    name: cross-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: linux amd64 and arm64, windows amd64
        env:
          CGO_ENABLED: "0"
          GOPROXY: "off"
          GOTOOLCHAIN: local
        run: |
          GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/meshcompute-linux-amd64 ./cmd/meshcompute
          GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/meshcompute-linux-arm64 ./cmd/meshcompute
          GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/meshcompute-windows-amd64.exe ./cmd/meshcompute
          GOOS=windows GOARCH=amd64 go vet ./...

  installer-linux:
    name: installer smoke (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: install, run, uninstall
        env:
          HOME: ${{ runner.temp }}/home
          GOPROXY: "off"
          GOSUMDB: "off"
          GOTOOLCHAIN: local
        run: |
          mkdir -p "$HOME"
          sh installers/install.sh
          "$HOME/.local/bin/meshcompute" version
          HOME="$HOME" sh installers/uninstall.sh
          test ! -e "$HOME/.local/bin/meshcompute"

  installer-windows-syntax:
    name: installer syntax (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: |
          foreach ($file in 'installers/install.ps1', 'installers/install-prebuilt.ps1', 'installers/install-windows.ps1', 'installers/menu-windows.ps1', 'installers/uninstall.ps1') {
            $null = [ScriptBlock]::Create((Get-Content -Raw $file))
          }
          Write-Output 'PowerShell installer syntax OK'

  installer-windows-prebuilt:
    name: prebuilt install (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: build prebuilt executable
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\dist" | Out-Null
          go build -trimpath -o "$env:RUNNER_TEMP\dist\meshcompute-windows-amd64.exe" ./cmd/meshcompute
          (Get-FileHash -LiteralPath "$env:RUNNER_TEMP\dist\meshcompute-windows-amd64.exe" -Algorithm SHA256).Hash

      - name: install, verify, tamper refusal, uninstall without Go
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = "$env:RUNNER_TEMP\dist\meshcompute-windows-amd64.exe"
          $binDir = Join-Path $env:LOCALAPPDATA 'meshcompute\bin'
          $binary = Join-Path $binDir 'meshcompute.exe'
          $marker = Join-Path $binDir 'install.json'

          $goPath = (Get-Command go -ErrorAction Stop).Source
          $goDirs = @((Split-Path $goPath -Parent), "$env:GOROOT\bin") | Where-Object { $_ -and (Test-Path -LiteralPath $_) }
          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $entry = $_.TrimEnd('\')
            ($goDirs | Where-Object { $_.TrimEnd('\') -eq $entry }).Count -eq 0
          }) -join ';'
          if (Get-Command go -ErrorAction SilentlyContinue) { Write-Warning 'A second Go installation is still on PATH; the marker path is asserted below.' }

          & .\installers\install-prebuilt.ps1 -BinaryPath $exe -AllowElevated
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary failed to run.' }
          if (-not (Test-Path -LiteralPath $marker)) { throw 'install.json was not written.' }
          $info = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
          $expected = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          if ($info.sha256 -ne $expected) { throw 'install.json checksum does not match the binary.' }

          Add-Content -LiteralPath $binary -Value 'tamper' -NoNewline
          $refused = $false
          try { & .\installers\uninstall.ps1 -AllowElevated } catch { $refused = $true }
          if (-not $refused) { throw 'Uninstaller removed a modified binary without -Force.' }
          if (-not (Test-Path -LiteralPath $binary)) { throw 'Refused uninstall deleted the binary.' }

          & .\installers\uninstall.ps1 -Force -AllowElevated
          if (Test-Path -LiteralPath $binary) { throw 'Uninstaller left the binary behind.' }
          if (Test-Path -LiteralPath $marker) { throw 'Uninstaller left install.json behind.' }

          & .\installers\install-prebuilt.ps1 -BinaryPath $exe -AllowElevated
          & $binary version
          $clean = (& .\installers\uninstall.ps1 -AllowElevated) -join "`n"
          if ($clean -notmatch 'verified by install\.json') { throw "Uninstaller did not use install.json: $clean" }
          if (Test-Path -LiteralPath $binary) { throw 'Clean uninstall left the binary behind.' }
          if (Test-Path -LiteralPath $marker) { throw 'Clean uninstall left install.json behind.' }
          Write-Output 'Prebuilt install/uninstall OK without Go'
      - name: bundled install with Windows PowerShell restricted policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'go.exe')) }) -join ';'
          if (Get-Command go -ErrorAction SilentlyContinue) { throw 'Go still available.' }
          Copy-Item "$env:RUNNER_TEMP\dist\meshcompute-windows-amd64.exe" .
          $hash = (Get-FileHash .\meshcompute-windows-amd64.exe -Algorithm SHA256).Hash
          "$hash  meshcompute-windows-amd64.exe" | Set-Content -Encoding ascii SHA256SUMS
          & powershell.exe -NoProfile -ExecutionPolicy Restricted -Command '& .\install.cmd -AllowElevated'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled installation failed under Restricted policy.' }
          $binary = Join-Path $env:LOCALAPPDATA 'meshcompute\bin\meshcompute.exe'
          & $binary version
          if ($LASTEXITCODE -ne 0) { throw 'Installed binary failed.' }
          # Reinstall is idempotent and does not accumulate unnecessary backups.
          & powershell.exe -NoProfile -ExecutionPolicy Restricted -Command '& .\install.cmd -AllowElevated'
          if ($LASTEXITCODE -ne 0) { throw 'Idempotent installation failed.' }
          & .\installers\uninstall.ps1 -AllowElevated
          if (Test-Path -LiteralPath $binary) { throw 'Uninstall failed.' }

  windows-launcher:
    name: win.bat end-to-end (Windows PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: install, upgrade twice, host, key, join through win.bat
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          MESHCOMPUTE_NO_PAUSE: "1"
          MESHCOMPUTE_NO_BROWSER: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          # Mirror the release ZIP in a folder whose path has a space, like a
          # real "Desktop\New folder" extraction.
          $pkg = Join-Path $env:RUNNER_TEMP 'New folder'
          New-Item -ItemType Directory -Force -Path "$pkg\installers", "$pkg\scripts" | Out-Null
          Copy-Item win.bat, join.cmd, LICENSE $pkg
          Copy-Item installers\menu-windows.ps1, installers\install-windows.ps1, installers\install-prebuilt.ps1, installers\uninstall.ps1 "$pkg\installers"
          Copy-Item scripts\windows-gpu-setup.ps1 "$pkg\scripts"
          $binary = Join-Path $env:LOCALAPPDATA 'meshcompute\bin\meshcompute.exe'
          function Pack([string]$ver) {
            go -C "$env:GITHUB_WORKSPACE" build -trimpath -ldflags "-X main.version=$ver" -o "$pkg\meshcompute-windows-amd64.exe" ./cmd/meshcompute
            if ($LASTEXITCODE -ne 0) { throw 'build failed' }
            $h = (Get-FileHash "$pkg\meshcompute-windows-amd64.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            "$h  meshcompute-windows-amd64.exe" | Set-Content -Encoding ascii "$pkg\SHA256SUMS"
          }
          Push-Location $pkg
          try {
            foreach ($ver in 'ci-1', 'ci-2', 'ci-3') {
              # ci-2 is the upgrade that used to fail with File.Replace; ci-3
              # upgrades again while a .previous backup already exists.
              Pack $ver
              $log = (& .\win.bat install -AllowElevated 2>&1 | Out-String)
              Write-Output $log
              if ($LASTEXITCODE -ne 0) { throw "win.bat install failed for ${ver}: $log" }
              $got = (& $binary version)
              if ($got -ne $ver) { throw "expected installed version $ver, got $got" }
              Write-Output "installed $got"
            }
            & .\win.bat invite -AllowElevated
            if ($LASTEXITCODE -eq 0) { throw 'invite without a hosted group should fail' }

            $hostProc = Start-Process cmd.exe -ArgumentList '/c', 'win.bat host -AllowElevated > host.log 2>&1' -WorkingDirectory $pkg -WindowStyle Hidden -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while (-not ((Test-Path host.log) -and (Select-String -Path host.log -Pattern 'event=agent_start' -Quiet))) {
              if ((Get-Date) -gt $deadline) { Get-Content host.log -ErrorAction SilentlyContinue; throw 'host did not start' }
              Start-Sleep -Seconds 1
            }
            Get-Content host.log | Select-Object -First 4

            $out = (& .\win.bat invite -AllowElevated) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "invite failed: $out" }
            $key = ([regex]::Match($out, '(?m)^\s*([A-Za-z0-9_-]{200,})\s*$')).Groups[1].Value
            if (-not $key) { throw "no key in invite output: $out" }

            $joinProc = Start-Process cmd.exe -ArgumentList '/c', "win.bat join $key -AllowElevated > join.log 2>&1" -WorkingDirectory $pkg -WindowStyle Hidden -PassThru
            $deadline = (Get-Date).AddSeconds(90)
            while (-not ((Test-Path join.log) -and (Select-String -Path join.log -Pattern 'Connected to the group host' -Quiet))) {
              if ((Get-Date) -gt $deadline) { Get-Content join.log -ErrorAction SilentlyContinue; Get-Content host.log; throw 'worker did not connect' }
              Start-Sleep -Seconds 1
            }
            Get-Content join.log
            $status = (& $binary --home (Join-Path $env:APPDATA 'meshcompute-group') status) -join "`n"
            if ($status -notmatch 'worker-') { throw "host status does not list the worker: $status" }
            Write-Output 'win.bat install/upgrade/host/key/join OK'
          } catch {
            $msg = ($_ | Out-String) -replace "`r?`n", ' | '
            Write-Output "::error title=win.bat end-to-end::$msg"
            foreach ($f in 'host.log', 'join.log') {
              if (Test-Path $f) { $t = (Get-Content $f -Raw) -replace "`r?`n", ' | '; Write-Output "::error title=$f::$t" }
            }
            throw
          } finally {
            Get-Process meshcompute -ErrorAction SilentlyContinue | Stop-Process -Force
            Pop-Location
          }
